database:
  url: "postgresql://library:library_secret@localhost:5432/library_db"
  pool_size: 2500
  max_overflow: 2500

rabbitmq:
  url: "amqp://guest:guest@localhost:5672/"
  exchange_name: "domain_events"

kafka:
  bootstrap_servers: "localhost:9092"
  topic_prefix: "domain_events"
  consumer_group: "library-service"

sendgrid:
  api_key: "SG.placeholder"
  from_email: "admin@library.com"
  admin_email: "admin@library.com"

templates:
  dir: "src/infrastructure/templates"
  map:
    book_borrowed: "email/book_borrowed.html"

circuit_breakers:
  rabbitmq:
    failure_threshold: 5
    success_threshold: 2
    timeout: 30.0
  kafka:
    failure_threshold: 5
    success_threshold: 2
    timeout: 30.0
  sendgrid:
    failure_threshold: 3
    success_threshold: 2
    timeout: 60.0
