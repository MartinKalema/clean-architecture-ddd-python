database:
  url: "postgresql://library:library_secret@localhost:5432/library_db"
  pool_size: 2500
  max_overflow: 2500

rabbitmq:
  url: "amqp://guest:guest@localhost:5672/"
  exchange_name: "domain_events"

sendgrid:
  api_key: "SG.placeholder"
  from_email: "admin@library.com"
  admin_email: "admin@library.com"

templates:
  dir: "src/infrastructure/templates"
  map:
    book_borrowed: "email/book_borrowed.html"

# Circuit breaker configuration per external service
circuit_breakers:
  rabbitmq:
    failure_threshold: 5      # Open after N consecutive failures
    success_threshold: 2      # Close after N successes in half-open
    timeout: 30.0             # Seconds before testing recovery
  sendgrid:
    failure_threshold: 3      # Email is critical, fail faster
    success_threshold: 2
    timeout: 60.0             # Email services are slower to recover
