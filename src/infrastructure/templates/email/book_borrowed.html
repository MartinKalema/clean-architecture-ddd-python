<div style="font-family: Arial, sans-serif; padding: 20px; border: 1px solid #ddd; border-radius: 5px;">
    <h2 style="color: #333;">Library Notification</h2>
    <p>
        <strong>Book Title:</strong> {{ title }}<br>
        <strong>Borrowed On:</strong> {{ borrowed_date }}<br>
        <strong>Return Due:</strong> {{ return_date }}<br>
    </p>
    <p>Please return the book by the due date to avoid penalties.</p>
    <hr>
    <p style="font-size: 12px; color: #777;">This is an automated message from your Library System.</p>
</div>
