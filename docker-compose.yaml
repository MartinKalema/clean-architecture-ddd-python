services:
  nginx:
    image: nginx:alpine
    container_name: clean_arch_nginx
    ports:
      - "8000:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
      api-3:
        condition: service_healthy
      api-4:
        condition: service_healthy
      api-5:
        condition: service_healthy
      api-6:
        condition: service_healthy
      api-7:
        condition: service_healthy
      api-8:
        condition: service_healthy
    restart: unless-stopped

  seeder:
    build: .
    container_name: clean_arch_seeder
    env_file: .env.docker
    command: ["python", "scripts/seed_etcd_config.py"]
    depends_on:
      etcd:
        condition: service_healthy

  migrator:
    build: .
    container_name: clean_arch_migrator
    env_file: .env.docker
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://library:library_secret@postgres:5432/library_db
    depends_on:
      postgres:
        condition: service_healthy
      seeder:
        condition: service_completed_successfully

  api-1: &api-service
    build: .
    container_name: clean_arch_api_1
    env_file: .env.docker
    depends_on:
      migrator:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  api-2:
    <<: *api-service
    container_name: clean_arch_api_2

  api-3:
    <<: *api-service
    container_name: clean_arch_api_3

  api-4:
    <<: *api-service
    container_name: clean_arch_api_4

  api-5:
    <<: *api-service
    container_name: clean_arch_api_5

  api-6:
    <<: *api-service
    container_name: clean_arch_api_6

  api-7:
    <<: *api-service
    container_name: clean_arch_api_7

  api-8:
    <<: *api-service
    container_name: clean_arch_api_8

  postgres:
    image: postgres:16-alpine
    container_name: clean_arch_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library_secret
      POSTGRES_DB: library_db
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "max_connections=500"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "work_mem=32MB"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: clean_arch_pgbouncer
    ports:
      - "6432:6432"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: library
      DB_PASSWORD: library_secret
      DB_NAME: library_db
      LISTEN_PORT: 6432
      AUTH_TYPE: trust
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 10000
      MAX_DB_CONNECTIONS: 400
      DEFAULT_POOL_SIZE: 300
      MIN_POOL_SIZE: 50
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432 -U library -d library_db || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: clean_arch_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: clean_arch_redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    container_name: clean_arch_etcd
    ports:
      - "2379:2379"
      - "2380:2380"
    environment:
      ETCD_NAME: etcd0
      ETCD_DATA_DIR: /etcd-data
      ETCD_ADVERTISE_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_CLUSTER: etcd0=http://0.0.0.0:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: etcd-cluster-1
    volumes:
      - etcd_data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  locust-master:
    image: locustio/locust
    container_name: clean_arch_locust_master
    ports:
      - "8089:8089"
    volumes:
      - ./tests/load:/mnt/locust
    command: -f /mnt/locust/run_stages.py --master -H http://nginx:80
    depends_on:
      nginx:
        condition: service_started
    profiles:
      - loadtest

  locust-worker:
    image: locustio/locust
    volumes:
      - ./tests/load:/mnt/locust
    command: -f /mnt/locust/run_stages.py --worker --master-host locust-master
    depends_on:
      - locust-master
    profiles:
      - loadtest

volumes:
  postgres_data:
  etcd_data:
