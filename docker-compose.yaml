services:
  postgres:
    image: postgres:16-alpine
    container_name: clean_arch_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library_secret
      POSTGRES_DB: library_db
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "work_mem=32MB"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: clean_arch_pgbouncer
    ports:
      - "6432:6432"
    volumes:
      - ./src/infrastructure/configurations/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini
      - ./src/infrastructure/configurations/userlist.txt:/etc/pgbouncer/userlist.txt
    environment:
      # PostgreSQL backend
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USERNAME: library
      POSTGRESQL_PASSWORD: library_secret
      POSTGRESQL_DATABASE: library_db
      # PgBouncer settings
      PGBOUNCER_PORT: 6432
      PGBOUNCER_DATABASE: library_db
      PGBOUNCER_AUTH_TYPE: scram-sha-256
      # Pool mode: transaction is best for web apps (connection released after each transaction)
      PGBOUNCER_POOL_MODE: transaction
      # Client-side limits (how many app connections PgBouncer accepts)
      PGBOUNCER_MAX_CLIENT_CONN: 10000
      # Server-side limits (actual PostgreSQL connections)
      # This is the KEY setting - limits backend connections to PostgreSQL
      PGBOUNCER_MAX_DB_CONNECTIONS: 200
      PGBOUNCER_DEFAULT_POOL_SIZE: 100
      PGBOUNCER_MIN_POOL_SIZE: 25
      PGBOUNCER_RESERVE_POOL_SIZE: 50
      # Connection lifecycle
      PGBOUNCER_SERVER_IDLE_TIMEOUT: 600
      PGBOUNCER_SERVER_LIFETIME: 3600
      PGBOUNCER_SERVER_RESET_QUERY: DISCARD ALL
      # Query timeout
      PGBOUNCER_QUERY_TIMEOUT: 120
      PGBOUNCER_QUERY_WAIT_TIMEOUT: 60
    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3-management
    container_name: clean_arch_rabbitmq
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
