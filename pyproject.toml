[project]
name = "clean_architecture_app"
version = "0.2.0"
description = "A Python backend application demonstrating Clean Architecture and DDD."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "dependency-injector",
    "requests",
    "PyYAML",
    "click",
    "pydantic",
    "aiosqlite",
    "asyncpg",
    "psycopg2-binary",
    "pytest-asyncio",
    "httpx",
    "greenlet",
    "locust",
    "sendgrid",
    "jinja2",
    "alembic",
    "etcd3",
    "protobuf>=3.19.0,<4.0.0",
    "python-dotenv",
    # Alembic must validate and apply the operator-declared IANA timezone even
    # on minimal containers or hosts without a system timezone database.
    "tzdata>=2024.1",
    "redis",
    "aiokafka",
    "aiohttp",
    "elasticsearch>=8.0.0,<9.0.0"
]

[tool.pytest.ini_options]
addopts = "-v"
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    # etcd3 is unmaintained and ships protobuf code generated for the
    # legacy descriptor API (the reason for the protobuf<4 pin). Its
    # warnings are not actionable from this codebase; silencing them
    # keeps deprecation warnings meaningful for our own code.
    "ignore::DeprecationWarning:etcd3.*",
    "ignore::DeprecationWarning:google.protobuf.*",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# The application imports everything as src.* — install it that way.
# Without this, setuptools auto-discovery does not register the package
# and `pip install -e .` provides nothing importable (works locally only
# when the repo root happens to be on sys.path).
include = ["src*"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
exclude = ["tests/"]

# SQLAlchemy's legacy Column() declarative style types instance attributes
# as Column[...] rather than their values; silence value-vs-column noise in
# the persistence adapters without losing import/name/annotation checking
[[tool.mypy.overrides]]
module = "src.infrastructure.adapters.*"
disable_error_code = ["arg-type", "assignment", "return-value", "index", "attr-defined"]
